name: CI/CD Pipeline

on:
  push:
    branches: [main, demo]
  pull_request:
    branches: [main]

jobs:
  test-and-quality:
    name: 🧪 Test & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build and run tests
        run: gradle test jacocoTestReport --no-daemon

      - name: SonarCloud Scan & Quality Gate
        run: gradle sonar --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 30

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/test/
          retention-days: 30

  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test-and-quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/java-cicd-demo
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image info
        run: |
          echo "✅ Image pushed!"
          echo "📦 Tags: ${{ steps.meta.outputs.tags }}"

  deploy:
    name: 🚀 Run Container
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Pull latest image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/java-cicd-demo:latest

      - name: Stop and remove old container
        run: |
          docker stop java-cicd-demo 2>/dev/null || true
          docker rm java-cicd-demo 2>/dev/null || true

      - name: Run new container
        run: |
          docker run -d \
            --name java-cicd-demo \
            -p 8080:8080 \
            --restart unless-stopped \
            ${{ secrets.DOCKERHUB_USERNAME }}/java-cicd-demo:latest

      - name: Wait for container to start
        run: sleep 15

      - name: Verify container is running
        run: |
          docker ps | grep java-cicd-demo
          docker logs java-cicd-demo
          curl -f http://localhost:8080/api/health
          echo "✅ Deployment successful!"

      - name: Test /demo endpoint
        run: curl -s http://localhost:8080/api/demo | python3 -m json.tool
